name: Deploy to EC2

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.315

      - name: Build
        run: dotnet build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHub-Action-Role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Trigger CodeDeploy
        run: |
          echo "Triggering AWS CodeDeploy"
          commit_hash=$(git rev-parse HEAD)
          aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APP }} \
            --deployment-group-name ${{ secrets.CODEDEPLOY_GROUP }} \
            --github-location repository=${GITHUB_REPOSITORY},commitId=$commit_hash \
            --file-exists-behavior OVERWRITE \
            --region ${{ secrets.AWS_REGION }}
